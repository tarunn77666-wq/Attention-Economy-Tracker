<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attention Economy Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <h1>Attention Economy Tracker</h1>
    <p class="subtitle">Measure how much your brain is being drained</p>

    <div class="tracker-card">
        <div class="metric">
            <span>Tab Switches</span>
            <h2 id="tabs">0</h2>
        </div>

        <div class="metric">
            <span>Scroll Intensity</span>
            <h2 id="scroll">0%</h2>
        </div>

        <div class="metric">
            <span>Focus Score</span>
            <h2 id="focus">100</h2>
        </div>
    </div>

    <button id="simulate">Simulate Distraction</button>

    <div class="insight" id="insight">
        Stay focused. Your mind is still sharp.
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
